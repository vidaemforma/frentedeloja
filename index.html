g:0;width:min(620px,94vw);max-height:90vh;color:var(--ink);box-shadow:0 25px 100px #10264544}dialog::backdrop{background:#10264588;backdrop-filter:blur(3px)}.dialog-head{display:flex;align-items:center;justify-content:space-between;padding:21px 24px;border-bottom:1px solid var(--line)}.dialog-head h2{margin:0}.dialog-head button{padding:3px 9px;font-size:21px;border:0}.dialog-body{padding:24px}.dialog-foot{padding:18px 24px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}#toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:var(--navy);color:white;padding:15px 25px;border-radius:10px;z-index:50;max-width:90vw;box-shadow:0 8px 25px #0002}#busy{position:fixed;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,#2274ed,#8ed3ff,#2274ed);z-index:100;animation:pulse 1s infinite}@keyframes pulse{50%{opacity:.4}}.receipt{font:13px monospace;white-space:pre-wrap;line-height:1.6;background:#f8fafc;padding:20px;border-radius:10px}.badge{font-size:11px;padding:5px 8px;border-radius:6px;background:var(--sky);color:var(--blue)}.badge.cancel{background:#fff0f2;color:var(--red)}.stack{display:grid;gap:15px}.bottom-note{margin-top:22px;font-size:11px;color:#8292a6;text-align:center}.connection{margin-top:25px}.connection summary{cursor:pointer;color:var(--muted);font-size:12px}.connection .field{margin-top:14px}.form-error{color:var(--red);margin-bottom:12px;font-size:13px}.check{display:flex;align-items:center;gap:8px}.check input{width:auto}.payments{display:grid;gap:8px;margin:15px 0}.pay-row{background:#f4f7fb;padding:10px;border-radius:8px}.pay-row button{padding:3px 8px}.mobile-title{display:none}

<script>
'use strict';
// Pode preencher a URL /exec aqui antes de subir ao GitHub. Não coloque senhas neste arquivo.
const DEFAULT_API_URL = '';
const $=id=>document.getElementById(id), money=n=>(Number(n||0)/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rid=()=>crypto.randomUUID(), date=s=>new Date(s).toLocaleString('pt-BR',{timeZone:'America/Sao_Paulo'}), roleName=r=>({adm:'Administrador',gerente:'Gerente de loja',caixa:'Colaborador / Caixa'}[r]||r);
function parseMoney(v){let s=String(v??'').trim().replace(/R\$\s*/g,'');if(!s)return 0;if(!/^\d+(?:\.\d{3})*(?:,\d{1,2})?$/.test(s)&&!/^\d+(?:,\d{1,2})?$/.test(s))throw Error('Use valores como 1.234,56.');const n=Math.round(Number(s.replace(/\./g,'').replace(',','.'))*100);if(!Number.isSafeInteger(n)||n<0)throw Error('Valor inválido.');return n;}
const decimal=n=>(n/100).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2,useGrouping:false});
let state=null,token=sessionStorage.getItem('vf_token')||'',page='dashboard',cart=[],payments=[],requestId=rid(),lastSale=null,pendingSale=null,working=false;
let apiUrl=localStorage.getItem('vf_api')||DEFAULT_API_URL;
function toast(s){$('toast').textContent=s;$('toast').classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').classList.add('hidden'),5500);}
function validUrl(url){return /^https:\/\/script\.google\.com\/macros\/s\/[a-zA-Z0-9_-]+\/exec$/.test(url);}
async function api(action,data={}){if(!validUrl(apiUrl))throw Error('Configure uma URL válida do Apps Script, terminada em /exec.');$('busy').classList.remove('hidden');try{const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),60000);let res;try{res=await fetch(apiUrl,{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,token,data,...(action==='login'?data:{})}),signal:controller.signal});}finally{clearTimeout(timer);}if(!res.ok)throw Error('Servidor indisponível. Confira a implantação.');const j=await res.json();if(!j.ok)throw Error(j.error);return j.data;}catch(e){if(e.name==='AbortError'||e instanceof TypeError)throw Error('Sem confirmação do servidor. Confira a internet e tente novamente; a mesma venda não será duplicada.');throw e;}finally{$('busy').classList.add('hidden');}}
function setState(s){state=s;}
async function sync(){setState(await api('sync'));render();}
async function run(fn){if(working)return;working=true;const buttons=Array.from(document.querySelectorAll('button')).map(b=>[b,b.disabled]);buttons.forEach(([b])=>b.disabled=true);try{await fn();}catch(e){toast(e.message);}finally{working=false;buttons.forEach(([b,disabled])=>{if(b.isConnected)b.disabled=disabled;});}}
function field(name,label,value='',type='text',required=false){return `<div class="field"><label for="f_${name}">${label}</label><input id="f_${name}" name="${name}" type="${type}" value="${esc(value)}" ${required?'required':''} ${type==='password'?'autocomplete="new-password"':''}></div>`;}
function select(name,label,options,value){return `<div class="field"><label for="f_${name}">${label}</label><select id="f_${name}" name="${name}">${options.map(([v,t])=>`<option value="${esc(v)}" ${String(v)===String(value)?'selected':''}>${esc(t)}</option>`).join('')}</select></div>`;}
function formData(f){return Object.fromEntries(new FormData(f).entries());}
function modal(title,body,submit,label='Salvar'){const m=$('modal');m.innerHTML=`<form id="modalForm"><div class="dialog-head"><h2>${esc(title)}</h2><button type="button" aria-label="Fechar" onclick="closeModal()">×</button></div><div class="dialog-body">${body}<div id="modalError" class="form-error" role="alert"></div></div><div class="dialog-foot"><button type="button" onclick="closeModal()">Voltar</button>${submit?`<button class="primary" id="modalSubmit">${esc(label)}</button>`:''}</div></form>`;if(!m.open)m.showModal();$('modalForm').onsubmit=e=>{e.preventDefault();if(working)return;run(async()=>{try{await submit(formData(e.target));}catch(err){if($('modalError'))$('modalError').textContent=err.message;throw err;}});};}
function closeModal(){if(working)return;$('modal').close();}
function loginView(){state=null;$('app').innerHTML=`<div class="login"><section class="login-hero"><div class="brand"><b class="mark">↗</b>Venda<span>Flow</span> <small>PDV</small></div><h1>Seu balcão.<br>Um novo fluxo.</h1><p>Da leitura do produto ao último centavo de troco. Tudo em um só lugar para sua loja vender melhor.</p><p style="margin-top:50px;font-size:12px">FRENTE DE CAIXA • SIMPLES E CONECTADO</p></section><section class="login-form"><div><div class="brand"><b class="mark">↗</b>Venda<span>Flow</span></div><h2>Bom ter você por aqui.</h2><p class="muted">Entre na sua conta para abrir o caixa.</p><form id="loginForm">${field('email','E-mail','','email',true)}${field('password','Senha','','password',true)}<p id="loginError" class="form-error" role="alert"></p><button class="primary">Entrar no sistema →</button></form><details class="connection" ${!apiUrl?'open':''}><summary>Configurar conexão da loja</summary><div class="field"><label for="url">URL do aplicativo da web</label><input id="url" placeholder="https://script.google.com/macros/s/.../exec" value="${esc(apiUrl)}"></div><button id="saveUrl" type="button">Salvar conexão</button><p class="hint muted">Use a URL fornecida ao publicar o Apps Script.</p></details><p class="bottom-note">VendaFlow PDV · Frente de caixa e gestão de loja</p><footer class="bottom-note">Desenvolvido por JRML Serviços Administrativos LTDA</footer></div></section></div>`;$('saveUrl').onclick=()=>{const v=$('url').value.trim();if(!validUrl(v))return toast('Informe a URL do Apps Script terminada em /exec.');apiUrl=v;localStorage.setItem('vf_api',v);toast('Conexão salva.');};$('loginForm').onsubmit=e=>{e.preventDefault();run(async()=>{try{const s=await api('login',formData(e.target));token=s.token;sessionStorage.setItem('vf_token',token);setState(s);page='dashboard';dashboardFilters={from:localDay(new Date()),to:localDay(new Date()),seller:'',customer:''};salesFilters={from:'',to:'',seller:'',customer:'',status:'',query:''};render();recoverSale();}catch(err){$('loginError').textContent=err.message;throw err;}});};}
function drawer(){return state.drawers.find(c=>c.userId===state.user.id&&c.status==='aberto');}
function render(){if(!state)return loginView();const c=drawer(),manager=state.user.role!=='caixa';const nav=[['dashboard','◫','Dashboard'],['pdv','▦','Frente de caixa'],['vendas','▤','Vendas'],['caixa','▣','Meu caixa'],['produtos','◇','Produtos'],['clientes','♙','Clientes'],['vendedores','♧','Vendedores'],...(state.user.role==='adm'?[['usuarios','♧','Equipe'],['loja','⚙','Minha loja']]:[])];$('app').innerHTML=`<div class="shell"><aside class="side"><div class="brand"><b class="mark">↗</b>Venda<span>Flow</span></div><small>OPERAÇÃO DA LOJA</small><nav>${nav.map(([id,icon,label])=>`<button class="${page===id?'active':''}" onclick="go('${id}')">${icon} &nbsp; ${label}</button>`).join('')}</nav><footer><div class="row"><span class="avatar">${esc(state.user.name.charAt(0))}</span><div><strong>${esc(state.user.name)}</strong><br><small>${esc(roleName(state.user.role))}</small></div></div><div class="actions" style="margin-top:15px"><button onclick="passwordModal()">Minha senha</button><button onclick="logout()">Sair</button></div></footer></aside><main class="main"><header class="topbar"><div><strong>${esc(state.store.name)}</strong><br><small>${new Date().toLocaleDateString('pt-BR',{timeZone:'America/Sao_Paulo',weekday:'long',day:'numeric',month:'long'})}</small></div><div class="actions" style="align-items:center"><span class="pill ${c?'':'closed'}">● ${c?esc(c.label)+' aberto':'Caixa fechado'}</span><button onclick="run(sync)" title="Atualizar dados">↻ Atualizar</button><button onclick="logout()" title="Sair">Sair</button></div></header><div class="workspace" id="view"></div><footer class="system-footer">Desenvolvido por JRML Serviços Administrativos LTDA</footer></main></div>`;({dashboard:renderDashboard,pdv:renderPos,vendas:renderSales,caixa:renderDrawer,produtos:renderProducts,clientes:renderCustomers,vendedores:renderSellers,usuarios:renderUsers,loja:renderStore}[page]||renderDashboard)();}
function go(p){if(working)return;page=p;render();}
function head(title,sub,button=''){return `<div class="page-head"><div><h1>${title}</h1><p>${sub}</p></div>${button}</div>`;}
function subtotal(){return cart.reduce((n,i)=>n+i.qty*i.price,0);}
let discountMode='reais',discountInput='';let selectedCustomer='',customerQuery='',selectedSeller='';

function updateTotal(){const d=discountValue(),t=subtotal()-d,valid=Number.isSafeInteger(d)&&d>=0&&d<=subtotal();$('total').textContent=valid?money(t):'Valor inválido';$('discountHint').textContent=valid?(d*100>subtotal()*20?'Senha de gerente ou administrador necessária.':`Desconto: ${money(d)}`):'Confira o desconto informado.';$('checkout').disabled=!valid||t<=0||!drawer()||!cart.length;}
function searchProducts(enter=false){const q=$('search').value.trim(),term=q.toLocaleLowerCase('pt-BR'),list=state.products.filter(p=>p.active&&(p.name.toLocaleLowerCase('pt-BR').includes(term)||p.barcode.includes(q)));const exact=state.products.find(p=>p.active&&p.barcode&&p.barcode===q);if(enter&&q&&(exact||list.length===1)){addItem((exact||list[0]).id);return;}if(enter&&!list.length)toast('Produto não encontrado.');$('results').innerHTML=q?list.slice(0,12).map(p=>`<div class="result"><div><strong>${esc(p.name)}</strong><br><small>${esc(p.barcode||p.category||'Sem código')}</small></div><div class="actions"><strong>${money(p.price)}</strong><button onclick="addItem('${p.id}')">Adicionar</button></div></div>`).join('')||'<p class="hint muted">Nenhum produto encontrado.</p>':'';}

function checkoutModal(){if(pendingSale){recoverSale();return;}if(!cart.length||!drawer())return;const discount=discountValue(),total=subtotal()-discount;if(!Number.isSafeInteger(discount)||discount<0||total<=0)return toast('Confira o desconto.');payments=[];modal('Finalizar venda',`<div class="row"><span>Total da venda</span><strong class="total">${money(total)}</strong></div><p class="hint muted">Informe os pagamentos realizados. Para crédito, a confirmação é feita na maquininha.</p><div class="two">${select('method','Forma de pagamento',[['dinheiro','Dinheiro'],['pix','Pix'],['debito','Débito'],['credito','Crédito']],'dinheiro')}${field('amount','Valor recebido',decimal(total))}</div>${select('installments','Parcelas no crédito',Array.from({length:10},(_,i)=>[i+1,i===0?'À vista':`${i+1} vezes`]),1)}<button type="button" onclick="addPayment()">+ Adicionar pagamento</button><div id="payments" class="payments"></div><div id="paymentTotals" class="notice"></div>${discount*100>subtotal()*20?`<div class="notice" style="margin-top:18px">Desconto acima de 20%: o superior precisa autorizar esta venda.</div>${field('supervisorEmail','E-mail do superior','','email',true)}${field('supervisorPassword','Senha do superior','','password',true)}`:''}`,async f=>{
if(!payments.length)throw Error('Adicione pelo menos um pagamento.');const paid=payments.reduce((n,p)=>n+p.amount,0),cash=payments.filter(p=>p.method==='dinheiro').reduce((n,p)=>n+p.amount,0);if(paid<total||paid-total>cash)throw Error('Confira os pagamentos e o troco.');
pendingSale={requestId,drawerId:drawer().id,items:cart.map(i=>({id:i.id,qty:i.qty,price:i.price})),discount,customerId:selectedCustomer,sellerId:selectedSeller,payments:payments.map(p=>({...p}))};sessionStorage.setItem('vf_pending',JSON.stringify({userId:state.user.id,data:pendingSale}));
const sale=await api('sale.create',{...pendingSale,supervisorEmail:f.supervisorEmail,supervisorPassword:f.supervisorPassword});finishSale(sale);$('modal').close();receiptModal(sale);try{setState(await api('sync'));render();}catch(e){toast('Venda salva. Atualize os dados quando a conexão voltar.');}
},'Confirmar e salvar venda');$('f_installments').disabled=true;$('f_method').onchange=()=>{$('f_installments').disabled=$('f_method').value!=='credito';};renderPayments();}
function addPayment(){try{const amount=parseMoney($('f_amount').value);if(amount<=0)throw Error('Informe um valor maior que zero.');if(payments.length>=15)throw Error('Limite de 15 pagamentos.');payments.push({method:$('f_method').value,amount,installments:$('f_method').value==='credito'?Number($('f_installments').value):1});renderPayments();const missing=Math.max(0,subtotal()-discountValue()-payments.reduce((n,p)=>n+p.amount,0));$('f_amount').value=decimal(missing);}catch(e){toast(e.message);}}

function paymentName(p){return ({dinheiro:'Dinheiro',pix:'Pix',debito:'Débito',credito:p.installments>1?`Crédito ${p.installments}x`:'Crédito à vista'})[p.method];}
function finishSale(s){lastSale=s;sessionStorage.removeItem('vf_pending');pendingSale=null;cart=[];payments=[];discountInput='';selectedCustomer='';customerQuery='';selectedSeller='';requestId=rid();if(state&&!state.sales.some(x=>x.id===s.id))state.sales.push(s);}
function recoverSale(){try{const p=JSON.parse(sessionStorage.getItem('vf_pending')||'null');if(!p||p.userId!==state.user.id)return;pendingSale=p.data;modal('Conferir finalização pendente','<p>A última tentativa ficou sem confirmação. Consulte o histórico ou reenvie a mesma venda para recuperar o resultado sem duplicar.</p><p class="hint muted">Se o desconto for acima de 20% e a venda ainda não existir, será necessária uma nova autorização.</p>'+field('supervisorEmail','E-mail do superior, se necessário','','email')+field('supervisorPassword','Senha do superior, se necessário','','password'),async f=>{const s=await api('sale.create',{...pendingSale,supervisorEmail:f.supervisorEmail,supervisorPassword:f.supervisorPassword});finishSale(s);$('modal').close();receiptModal(s);setState(await api('sync'));render();},'Conferir / reenviar');}catch(e){toast(e.message);}}
function localDay(value){const p=new Intl.DateTimeFormat('en-CA',{timeZone:'America/Sao_Paulo',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date(value));return ['year','month','day'].map(k=>p.find(x=>x.type===k).value).join('-');}
const numberBR=(n,d=0)=>Number(n||0).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
let dashboardFilters={from:localDay(new Date()),to:localDay(new Date()),seller:'',customer:''};
let salesFilters={from:'',to:'',seller:'',customer:'',status:'',query:''};
function dateFilterValid(f){return !f.from||!f.to||f.from<=f.to;}
function filterSales(sales,f){if(!dateFilterValid(f))return [];const q=normalizedSearch(f.query);return sales.filter(s=>{const day=localDay(s.at);return (!f.from||day>=f.from)&&(!f.to||day<=f.to)&&(!f.status||s.status===f.status)&&(!f.seller||(f.seller==='__none__'?!s.seller:s.seller?.id===f.seller))&&(!f.customer||(f.customer==='__none__'?!s.customer:s.customer?.id===f.customer))&&(!q||normalizedSearch(`${s.number} ${s.customer?.name||''} ${s.customer?.document||''} ${s.seller?.name||''} ${s.userName}`).includes(q));});}
function saleFilterOptions(type){const map=new Map();const singular=type==='sellers'?'seller':'customer';(state[type]||[]).forEach(v=>map.set(v.id,v.name));state.sales.forEach(s=>{const v=s[singular];if(v&&!map.has(v.id))map.set(v.id,v.name);});return [...map].sort((a,b)=>a[1].localeCompare(b[1],'pt-BR'));}
function filtersMarkup(prefix,f,withStatus=false){const options=(type,value)=>[['','Todos'],['__none__',type==='sellers'?'Sem vendedor':'Sem cliente'],...saleFilterOptions(type)].map(([v,label])=>`<option value="${esc(v)}" ${v===value?'selected':''}>${esc(label)}</option>`).join('');return `<div class="filter-grid"><div><label for="${prefix}From">Data inicial</label><input id="${prefix}From" type="date" value="${esc(f.from)}"></div><div><label for="${prefix}To">Data final</label><input id="${prefix}To" type="date" value="${esc(f.to)}"></div><div><label for="${prefix}Seller">Vendedor</label><select id="${prefix}Seller">${options('sellers',f.seller)}</select></div><div><label for="${prefix}Customer">Cliente</label><select id="${prefix}Customer">${options('customers',f.customer)}</select></div></div><div class="actions" style="margin-top:14px"><button type="button" id="${prefix}Today">Hoje</button><button type="button" id="${prefix}Clear">Limpar filtros</button>${withStatus?`<select id="${prefix}Status" aria-label="Status das vendas" style="max-width:190px"><option value="">Todos os status</option><option value="concluida" ${f.status==='concluida'?'selected':''}>Concluídas</option><option value="cancelada" ${f.status==='cancelada'?'selected':''}>Canceladas</option></select><input id="${prefix}Query" aria-label="Buscar venda" placeholder="Buscar número, cliente, vendedor ou operador" value="${esc(f.query)}" style="flex:1;min-width:200px">`:''}</div><p id="${prefix}FilterError" class="form-error" role="alert" style="margin:8px 0 0"></p>`;}
function bindFilters(prefix,f,refresh,withStatus=false){for(const [suffix,key] of [['From','from'],['To','to'],['Seller','seller'],['Customer','customer'],...(withStatus?[['Status','status'],['Query','query']]:[])]){$(prefix+suffix)[key==='query'?'oninput':'onchange']=e=>{f[key]=e.target.value;refresh();};}$(prefix+'Today').onclick=()=>{f.from=f.to=localDay(new Date());$(prefix+'From').value=f.from;$(prefix+'To').value=f.to;refresh();};$(prefix+'Clear').onclick=()=>{Object.assign(f,{from:'',to:'',seller:'',customer:'',...(withStatus?{status:'',query:''}:{})});for(const suffix of ['From','To','Seller','Customer',...(withStatus?['Status','Query']:[])])$(prefix+suffix).value='';refresh();};}
function salesMetrics(sales){const completed=sales.filter(s=>s.status==='concluida'),products=new Map(),sellers=new Map();let total=0,subtotal=0,discount=0,units=0;for(const s of completed){total+=s.total;subtotal+=s.subtotal;discount+=s.discount;const count=s.items.reduce((n,i)=>n+i.qty,0);units+=count;const sellerKey=s.seller?.id||'__none__',v=sellers.get(sellerKey)||{id:sellerKey,name:s.seller?.name||'Sem vendedor',sales:0,units:0,total:0,discount:0};v.sales++;v.units+=count;v.total+=s.total;v.discount+=s.discount;sellers.set(sellerKey,v);for(const i of s.items){const p=products.get(i.id)||{id:i.id,name:i.name,qty:0,gross:0};p.qty+=i.qty;p.gross+=i.total;products.set(i.id,p);}}
return {count:completed.length,total,subtotal,discount,units,discountPct:subtotal?discount/subtotal*100:0,pa:completed.length?units/completed.length:0,ticket:completed.length?total/completed.length:0,products:[...products.values()].sort((a,b)=>b.qty-a.qty||b.gross-a.gross||a.name.localeCompare(b.name,'pt-BR')),sellers:[...sellers.values()].sort((a,b)=>b.total-a.total||b.sales-a.sales||a.name.localeCompare(b.name,'pt-BR'))};}
function renderDashboard(){$('view').innerHTML=head('Dashboard','O ritmo das vendas da sua loja.',`<button class="primary" onclick="go('pdv')">+ Nova venda</button>`)+`<div class="card" style="margin-bottom:20px">${filtersMarkup('dash',dashboardFilters)}<p class="hint muted" style="margin:12px 0 0">Período pela data da venda, no horário de São Paulo. ${state.user.role==='caixa'?'Você visualiza somente as vendas realizadas pelo seu usuário.':'Você visualiza as vendas de toda a equipe.'}</p></div><div id="dashboardBody"></div>`;bindFilters('dash',dashboardFilters,updateDashboard);updateDashboard();}
function updateDashboard(){const valid=dateFilterValid(dashboardFilters);$('dashFilterError').textContent=valid?'':'A data inicial deve ser anterior ou igual à data final.';const sales=filterSales(state.sales,dashboardFilters),m=salesMetrics(sales),day=dashboardFilters.from===localDay(new Date())&&dashboardFilters.to===localDay(new Date()),suffix=day?'do dia':'do período';const stat=(label,value,note,cls='')=>`<div class="card metric"><small>${label}</small><div class="stat ${cls}">${value}</div><p class="hint muted">${note}</p></div>`;const maxQty=m.products[0]?.qty||1,maxSeller=m.sellers[0]?.total||1;
$('dashboardBody').innerHTML=`<div class="metrics-grid">${stat('VENDAS '+suffix.toUpperCase(),numberBR(m.count),'Vendas concluídas')}${stat('VALOR VENDIDO',money(m.total),'Após descontos · Ticket médio '+money(Math.round(m.ticket)),'green')}${stat('ITENS VENDIDOS',numberBR(m.units),'Soma das quantidades dos produtos')}${stat('PA · ITENS POR VENDA',numberBR(m.pa,2),'Itens vendidos ÷ quantidade de vendas')}${stat('DESCONTOS '+suffix.toUpperCase(),money(m.discount),'Valor total concedido nas vendas','red')}${stat('DESCONTO PERCENTUAL',numberBR(m.discountPct,2)+'%','Desconto total ÷ valor bruto × 100','red')}</div><div class="dashboard-grid"><section class="card"><div class="row"><h3>Produtos mais vendidos</h3><span class="badge">Por quantidade</span></div>${m.products.length?`<div class="notice" style="margin:8px 0 16px"><strong>${esc(m.products[0].name)}</strong><br>${numberBR(m.products[0].qty)} unidades · Líder ${suffix}${m.products.filter(p=>p.qty===m.products[0].qty).length>1?' · Empate em quantidade':''}</div><ol class="ranking">${m.products.slice(0,5).map((p,k)=>`<li><div class="row"><span><b class="rank-number">${k+1}</b>${esc(p.name)}</span><strong>${numberBR(p.qty)} un.</strong></div><div class="bar-track"><div class="bar-fill" style="width:${p.qty/maxQty*100}%"></div></div></li>`).join('')}</ol>`:'<div class="empty"><strong>Nenhuma venda no período</strong>Os produtos aparecerão após as vendas concluídas.</div>'}<p class="hint muted">Ranking pela soma das unidades vendidas, incluindo quantidades maiores que 1 no mesmo item.</p></section><section class="card"><div class="row"><h3>Vendas por vendedor</h3><span class="badge">Valor líquido</span></div>${m.sellers.length?m.sellers.map(v=>`<div class="seller-rank"><div class="row"><strong>${esc(v.name)}</strong><strong class="green">${money(v.total)}</strong></div><div class="bar-track"><div class="bar-fill" style="width:${v.total/maxSeller*100}%"></div></div><small>${numberBR(v.sales)} vendas · ${numberBR(v.units)} itens · PA ${numberBR(v.sales?v.units/v.sales:0,2)}</small></div>`).join(''):'<div class="empty"><strong>Nenhuma venda no período</strong>O desempenho de cada vendedor aparecerá aqui.</div>'}</section></div><div class="notice" style="margin-top:20px">Os indicadores excluem vendas canceladas. O desconto percentual é calculado sobre o valor bruto total das vendas selecionadas. ${sales.filter(s=>s.status==='cancelada').length?numberBR(sales.filter(s=>s.status==='cancelada').length)+' venda(s) cancelada(s) no filtro.':''}</div>`;}
function renderSales(){$('view').innerHTML=head('Vendas','Histórico de atendimentos e comprovantes.')+`<div class="card">${filtersMarkup('sales',salesFilters,true)}<p class="hint muted" id="salesSummary" style="margin-top:18px"></p><div class="table-wrap"><table><thead><tr><th>Venda / Data</th><th>Operador</th><th>Vendedor</th><th>Cliente</th><th>Total</th><th>Status</th><th>Ações</th></tr></thead><tbody id="saleRows"></tbody></table></div><p class="hint muted">Cancelamentos preservam o registro original. A devolução no Pix ou cartão deve ser feita manualmente.</p></div>`;bindFilters('sales',salesFilters,updateSalesList,true);updateSalesList();}
function updateSalesList(){$('salesFilterError').textContent=dateFilterValid(salesFilters)?'':'A data inicial deve ser anterior ou igual à data final.';const visible=filterSales(state.sales,salesFilters).slice().sort((a,b)=>b.at.localeCompare(a.at)),m=salesMetrics(visible);$('salesSummary').textContent=`${visible.length} registro(s) encontrado(s) · ${m.count} venda(s) concluída(s) · Valor líquido: ${money(m.total)}`;$('saleRows').innerHTML=visible.map(s=>`<tr><td><strong>${esc(s.number)}</strong><small>${date(s.at)}</small></td><td>${esc(s.userName)}</td><td>${esc(s.seller?.name||'Não informado')}</td><td>${esc(s.customer?.name||'Não identificado')}</td><td class="${s.status==='cancelada'?'red':'green'}"><strong>${money(s.total)}</strong></td><td><span class="badge ${s.status==='cancelada'?'cancel':''}">${s.status==='cancelada'?'Cancelada':'Concluída'}</span></td><td><div class="actions"><button onclick="showReceipt('${s.id}')">Comprovante</button>${s.status!=='cancelada'?`<button class="danger" onclick="cancelSaleModal('${s.id}')">Cancelar</button>`:''}</div></td></tr>`).join('')||'<tr><td colspan="7" class="empty">Nenhuma venda encontrada para os filtros.</td></tr>';}

function cancelSaleModal(id){const s=state.sales.find(s=>s.id===id);modal('Cancelar venda',`<p>Venda <strong>${esc(s.number)}</strong> · ${money(s.total)}</p><div class="notice">Devolva os pagamentos manualmente. Cancelamentos após o fechamento ficam registrados como devoluções posteriores, sem alterar a conferência já encerrada.</div>${field('reason','Motivo do cancelamento','','text',true)}`,async f=>{await api('sale.cancel',{id,reason:f.reason});$('modal').close();await sync();toast('Venda cancelada. Confira a devolução ao cliente.');},'Confirmar cancelamento');}
function balance(c){const b={dinheiro:0,pix:0,debito:0,credito:0,sangria:0,suprimento:0};state.sales.filter(s=>s.drawerId===c.id&&s.status==='concluida').forEach(s=>{s.payments.forEach(p=>b[p.method]+=p.amount);b.dinheiro-=s.change;});state.movements.filter(m=>m.drawerId===c.id).forEach(m=>b[m.type]+=m.amount);b.expected=c.opening+b.dinheiro+b.suprimento-b.sangria;return b;}
function renderDrawer(){const c=drawer();$('view').innerHTML=head('Meu caixa','Abertura, movimentações e conferência do seu turno.',c?'<button onclick="closeDrawerModal()">Fechar meu caixa</button>':'<button class="primary" onclick="openDrawerModal()">+ Abrir caixa</button>');if(c){const b=balance(c);$('view').insertAdjacentHTML('beforeend',`<div class="four" style="margin-bottom:20px"><div class="card"><small>DINHEIRO ESPERADO NA GAVETA</small><div class="stat green">${money(b.expected)}</div><p class="hint muted" style="margin:9px 0 0">${esc(c.label)} · Aberto em ${date(c.openedAt)}</p></div><div class="card"><small>RECEBIMENTOS VIA PIX</small><div class="stat">${money(b.pix)}</div></div><div class="card"><small>RECEBIMENTOS NO DÉBITO</small><div class="stat">${money(b.debito)}</div></div><div class="card"><small>RECEBIMENTOS NO CRÉDITO</small><div class="stat">${money(b.credito)}</div></div></div><div class="card"><div class="row"><h3>Movimentações em dinheiro</h3><div class="actions"><button onclick="moveModal('suprimento')">+ Suprimento</button><button class="danger" onclick="moveModal('sangria')">− Retirada</button></div></div><div class="row"><span>Saldo de abertura</span><strong>${money(c.opening)}</strong></div><div class="row" style="margin:14px 0"><span>Vendas em dinheiro, descontado o troco</span><strong>${money(b.dinheiro)}</strong></div>${state.movements.filter(m=>m.drawerId===c.id).map(m=>`<div class="result"><div>${esc(m.reason)}<small style="display:block">${date(m.at)} · ${m.type}</small></div><strong class="${m.type==='sangria'?'red':'green'}">${m.type==='sangria'?'−':'+'} ${money(m.amount)}</strong></div>`).join('')}</div>`);}else $('view').insertAdjacentHTML('beforeend','<div class="card empty"><div class="symbol">▣</div><strong>Seu caixa está fechado</strong>Informe o valor inicial para começar a vender.</div>');const drawers=state.drawers.slice().sort((a,b)=>b.openedAt.localeCompare(a.openedAt));$('view').insertAdjacentHTML('beforeend',`<div class="card" style="margin-top:20px"><h3>Turnos de caixa ${state.user.role!=='caixa'?'da equipe':''}</h3><div class="table-wrap"><table><thead><tr><th>Caixa / Operador</th><th>Abertura</th><th>Status</th><th>Esperado</th><th>Contado</th><th>Diferença</th></tr></thead><tbody>${drawers.map(x=>`<tr><td>${esc(x.label)}<small>${esc(x.userName)}</small></td><td>${date(x.openedAt)}</td><td>${x.status==='aberto'?'Aberto':'Fechado'}</td><td>${money(x.status==='fechado'?x.expected:balance(x).expected)}</td><td>${x.status==='fechado'?money(x.counted):'—'}</td><td class="${x.difference?'red':'green'}">${x.status==='fechado'?money(x.difference):'—'}</td></tr>`).join('')||'<tr><td colspan="6">Nenhum turno registrado.</td></tr>'}</tbody></table></div></div>`);}
function openDrawerModal(){if(drawer())return toast('Seu caixa já está aberto.');modal('Abrir meu caixa',field('label','Nome do caixa','Caixa '+state.user.name.split(' ')[0],'text',true)+field('opening','Valor inicial em dinheiro','0,00'),async f=>{await api('drawer.open',{label:f.label,opening:parseMoney(f.opening)});$('modal').close();await sync();toast('Caixa aberto. Boas vendas!');},'Abrir caixa');}
function moveModal(type){const id=rid();modal(type==='sangria'?'Retirar dinheiro':'Reforçar caixa',field('amount','Valor em dinheiro','','text',true)+field('reason','Motivo','','text',true),async f=>{await api('drawer.move',{requestId:id,drawerId:drawer().id,type,amount:parseMoney(f.amount),reason:f.reason});$('modal').close();await sync();},'Registrar movimento');}
function closeDrawerModal(){const c=drawer();modal('Fechar meu caixa','<p>Conte o dinheiro disponível na gaveta. O sistema fará a conferência com a abertura, vendas e movimentações.</p>'+field('counted','Valor contado em dinheiro','','text',true),async f=>{const closed=await api('drawer.close',{drawerId:c.id,counted:parseMoney(f.counted)});$('modal').close();await sync();modal('Conferência do fechamento',`<div class="stack"><div class="row"><span>Dinheiro esperado</span><strong>${money(closed.expected)}</strong></div><div class="row"><span>Dinheiro contado</span><strong>${money(closed.counted)}</strong></div><div class="row"><span>Diferença</span><strong class="${closed.difference?'red':'green'}">${money(closed.difference)}</strong></div><p class="hint muted">Caixa fechado em ${date(closed.closedAt)}.</p></div>`);},'Conferir e encerrar');}
function renderProducts(){const manager=state.user.role!=='caixa';$('view').innerHTML=head('Produtos','Seu catálogo, sem controle de estoque.',manager?'<button class="primary" onclick="productModal()">+ Cadastrar produto</button>':'')+`<div class="card"><div class="toolbar"><input id="productSearch" placeholder="Buscar nome ou código de barras" aria-label="Buscar produto"><span class="muted">${state.products.length} cadastrados</span></div><div class="table-wrap"><table><thead><tr><th>Produto</th><th>Código de barras</th><th>Categoria / Marca</th><th>Preço</th><th>Status</th>${manager?'<th></th>':''}</tr></thead><tbody id="productRows"></tbody></table></div></div>`;function filter(){const q=$('productSearch').value.toLowerCase();$('productRows').innerHTML=state.products.filter(p=>`${p.name} ${p.barcode}`.toLowerCase().includes(q)).map(p=>`<tr><td><strong>${esc(p.name)}</strong><small>${esc(p.variation)}</small></td><td>${esc(p.barcode||'—')}</td><td>${esc(p.category||'—')}<small>${esc(p.brand)}</small></td><td class="green"><strong>${money(p.price)}</strong></td><td>${p.active?'Ativo':'Inativo'}</td>${manager?`<td><button onclick="productModal('${p.id}')">Editar</button></td>`:''}</tr>`).join('')||'<tr><td colspan="6" class="empty">Cadastre seu primeiro produto para começar.</td></tr>';}$('productSearch').oninput=filter;filter();}
function productModal(id){const p=state.products.find(p=>p.id===id)||{};modal(id?'Editar produto':'Cadastrar produto',field('name','Nome do produto *',p.name,'text',true)+`<div class="two">${field('barcode','Código de barras',p.barcode)}${field('price','Preço de venda *',p.price?decimal(p.price):'','text',true)}</div><details><summary class="muted">Dados complementares · opcionais</summary><div style="margin-top:18px"><div class="two">${field('cost','Preço de custo',p.cost!=null?decimal(p.cost):'')}${field('category','Categoria',p.category)}${field('brand','Marca',p.brand)}${field('variation','Variação / tamanho / cor',p.variation)}</div>${field('photo','URL da foto (HTTPS)',p.photo,'url')}${field('expiry','Validade',p.expiry,'date')}</div></details><p></p><label class="check"><input type="checkbox" name="active" ${p.active!==false?'checked':''}> Produto ativo para venda</label>`,async f=>{await api('product.save',{...f,id,price:parseMoney(f.price),cost:f.cost?parseMoney(f.cost):null,active:f.active==='on'});$('modal').close();await sync();toast('Produto salvo.');});}
function renderCustomers(){$('view').innerHTML=head('Clientes','Identificação opcional no atendimento.','<button class="primary" onclick="customerModal()">+ Cadastrar cliente</button>')+`<div class="card"><div class="toolbar"><input id="customerSearch" placeholder="Buscar nome, telefone ou documento" aria-label="Buscar cliente"></div><div class="table-wrap"><table><thead><tr><th>Nome</th><th>Telefone</th><th>CPF / CNPJ</th><th>E-mail</th><th></th></tr></thead><tbody id="customerRows"></tbody></table></div></div>`;function filter(){const q=$('customerSearch').value.toLowerCase();$('customerRows').innerHTML=state.customers.filter(c=>`${c.name} ${c.phone} ${c.document}`.toLowerCase().includes(q)).map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.phone)}</td><td>${esc(c.document)}</td><td>${esc(c.email)}</td><td><button onclick="customerModal('${c.id}')">Editar</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">Nenhum cliente cadastrado.</td></tr>';}$('customerSearch').oninput=filter;filter();}
function customerModal(id){const c=state.customers.find(c=>c.id===id)||{};modal(id?'Editar cliente':'Cadastrar cliente',field('name','Nome *',c.name,'text',true)+`<div class="two">${field('phone','Telefone / WhatsApp',c.phone)}${field('document','CPF / CNPJ',c.document)}</div>`+field('email','E-mail',c.email,'email')+field('address','Endereço',c.address),async f=>{await api('customer.save',{id,...f});$('modal').close();await sync();});}
function renderUsers(){if(state.user.role!=='adm')return go('pdv');$('view').innerHTML=head('Equipe','Permissões e identificação de cada atendimento.','<button class="primary" onclick="userModal()">+ Novo usuário</button>')+`<div class="card table-wrap"><table><thead><tr><th>Nome</th><th>E-mail</th><th>Perfil</th><th>Status</th><th></th></tr></thead><tbody>${state.users.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td>${roleName(u.role)}</td><td>${u.active?'Ativo':'Inativo'}</td><td><button onclick="userModal('${u.id}')">Editar</button></td></tr>`).join('')}</tbody></table></div>`;}
function userModal(id){const u=state.users.find(u=>u.id===id)||{};modal(id?'Editar usuário':'Novo usuário',field('name','Nome *',u.name,'text',true)+field('email','E-mail *',u.email,'email',true)+select('role','Perfil',[['caixa','Colaborador / Caixa'],['gerente','Gerente de loja'],['adm','Administrador']],u.role||'caixa')+field('password',id?'Nova senha (deixe vazio para manter)':'Senha inicial · mínimo de 10 caracteres','','password',!id)+'<p class="hint muted">Ao redefinir a senha, os acessos existentes desse usuário serão encerrados.</p>'+`<label class="check"><input type="checkbox" name="active" ${u.active!==false?'checked':''}> Usuário ativo</label>`,async f=>{await api('user.save',{id,...f,active:f.active==='on'});$('modal').close();if(id===state.user.id&&f.password){token='';sessionStorage.removeItem('vf_token');loginView();toast('Senha atualizada. Entre novamente.');}else await sync();});}
function passwordModal(){modal('Alterar minha senha',field('password','Senha atual','','password',true)+field('newPassword','Nova senha · mínimo de 10 caracteres','','password',true),async f=>{await api('password.change',f);$('modal').close();token='';sessionStorage.removeItem('vf_token');loginView();toast('Senha alterada. Entre novamente.');});}
function renderStore(){const s=state.store;$('view').innerHTML=head('Minha loja','Informações exibidas no comprovante de venda.')+`<form id="storeForm" class="card" style="max-width:750px">${field('name','Nome da loja *',s.name,'text',true)}<div class="two">${field('document','CPF / CNPJ',s.document)}${field('phone','Telefone',s.phone)}</div>${field('address','Endereço',s.address)}${field('footer','Mensagem do comprovante',s.footer)}<button class="primary">Salvar dados da loja</button><p class="hint muted" style="margin-top:15px">Cada loja deve utilizar sua própria planilha e implantação do Apps Script.</p></form>`;$('storeForm').onsubmit=e=>{e.preventDefault();run(async()=>{await api('store.save',formData(e.target));await sync();toast('Dados da loja atualizados.');});};}
function receiptLines(s){const lines=[s.store.name,s.store.document?'CPF/CNPJ: '+s.store.document:'',s.store.address?'Endereço: '+s.store.address:'',s.store.phone?'Telefone: '+s.store.phone:'','','COMPROVANTE DE VENDA - SEM VALOR FISCAL',s.status==='cancelada'?'*** VENDA CANCELADA ***':'',s.number,date(s.at),'Operador: '+s.userName,'Vendedor: '+(s.seller?.name||'Não informado'),'Cliente: '+(s.customer?.name||'Não identificado'),s.customer?.document?'CPF/CNPJ: '+s.customer.document:'','------------------------------------------------'];s.items.forEach(i=>{lines.push(i.name,`${i.qty} x ${money(i.price)} = ${money(i.total)}`);});lines.push('------------------------------------------------','Subtotal: '+money(s.subtotal),'Desconto: '+money(s.discount),'TOTAL: '+money(s.total),'');s.payments.forEach(p=>{lines.push(paymentName(p)+': '+money(p.amount));if(p.method==='credito'&&p.installments>1){const base=Math.floor(p.amount/p.installments),rest=p.amount%p.installments;lines.push(`Parcelas: ${p.installments-rest} x ${money(base)}${rest?' e '+rest+' x '+money(base+1):''}`);}});lines.push('Recebido: '+money(s.paid),'Troco em dinheiro: '+money(s.change),'',s.store.footer);if(s.status==='cancelada')lines.push('Cancelamento: '+date(s.canceledAt),'Motivo: '+s.cancelReason,s.refundAfterClose?'Devolução após fechamento: conferir manualmente.':'');return lines.filter(x=>x!==undefined&&x!==null);}
function showReceipt(id){const s=state.sales.find(s=>s.id===id);if(s)receiptModal(s);}
function receiptModal(s){lastSale=s;modal(s.status==='cancelada'?'Venda cancelada':'Comprovante de venda',`<div class="receipt">${esc(receiptLines(s).join('\n'))}</div><div class="actions" style="margin-top:18px"><button type="button" class="primary" onclick="downloadReceipt()">↓ Baixar PDF</button><button type="button" onclick="shareReceipt()">Compartilhar no WhatsApp</button></div><p class="hint muted" style="margin-top:14px">No WhatsApp, anexe manualmente o PDF baixado.</p>`);}
// PDF vetorial sem dependências: WinAnsi, múltiplas páginas e valores exatos.
function pdfBytes(lines){const cp={'€':128,'‘':145,'’':146,'“':147,'”':148,'–':150,'—':151,'•':149,'…':133};const latin=s=>Array.from(s).map(c=>String.fromCharCode(c.charCodeAt(0)<=255?c.charCodeAt(0):cp[c]||63)).join('');const escapePdf=s=>latin(s).replace(/([\\()])/g,'\\$1');const wrapped=[];lines.forEach(l=>{const chunks=String(l).match(/.{1,85}/g)||[''];wrapped.push(...chunks);});const pages=[];for(let i=0;i<wrapped.length;i+=48)pages.push(wrapped.slice(i,i+48));if(!pages.length)pages.push(['']);const objs=[null,'<< /Type /Catalog /Pages 2 0 R >>','','<< /Type /Font /Subtype /Type1 /BaseFont /Courier /Encoding /WinAnsiEncoding >>'];const kids=[];pages.forEach(chunk=>{const pi=objs.length,ci=pi+1;kids.push(`${pi} 0 R`);const stream='BT /F1 10 Tf 45 795 Td 15 TL\n'+chunk.map((l,i)=>`${i?'T* ':''}(${escapePdf(l)}) Tj`).join('\n')+'\nET';objs.push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 3 0 R >> >> /Contents ${ci} 0 R >>`,`<< /Length ${stream.length} >>\nstream\n${stream}\nendstream`);});objs[2]=`<< /Type /Pages /Count ${pages.length} /Kids [${kids.join(' ')}] >>`;let out='%PDF-1.4\n',offsets=[0];for(let i=1;i<objs.length;i++){offsets.push(out.length);out+=`${i} 0 obj\n${objs[i]}\nendobj\n`;}const xref=out.length;out+=`xref\n0 ${objs.length}\n0000000000 65535 f \n`+offsets.slice(1).map(n=>String(n).padStart(10,'0')+' 00000 n \n').join('')+`trailer\n<< /Size ${objs.length} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`;return Uint8Array.from(out,c=>c.charCodeAt(0));}
function downloadReceipt(){if(!lastSale)return;const url=URL.createObjectURL(new Blob([pdfBytes(receiptLines(lastSale))],{type:'application/pdf'})),a=document.createElement('a');a.href=url;a.download=lastSale.number+'.pdf';a.click();setTimeout(()=>URL.revokeObjectURL(url),5000);}
function shareReceipt(){if(!lastSale)return;let phone=(lastSale.customer?.phone||'').replace(/\D/g,'');if(phone.length===10||phone.length===11)phone='55'+phone;window.open('https://wa.me/'+phone+'?text='+encodeURIComponent(receiptLines(lastSale).join('\n')),'_blank','noopener,noreferrer');}
async function logout(){if(working)return;await run(async()=>{try{await api('logout');}catch(_){}token='';state=null;cart=[];discountInput='';selectedCustomer='';customerQuery='';selectedSeller='';sessionStorage.removeItem('vf_token');$('modal').close();loginView();});}
window.addEventListener('online',()=>toast('Conexão restabelecida. Atualize os dados.'));window.addEventListener('offline',()=>toast('Sem internet. Aguarde a conexão antes de finalizar.'));window.addEventListener('beforeunload',e=>{if(cart.length){e.preventDefault();e.returnValue='';}});
document.addEventListener('keydown',e=>{if(e.key==='F2'&&state&&page==='pdv'&&!$('modal').open){e.preventDefault();$('search')?.focus();}});
(async()=>{loginView();if(token){try{setState(await api('sync'));render();recoverSale();}catch(e){token='';sessionStorage.removeItem('vf_token');toast(e.message);}}})();
</script></body></html>
